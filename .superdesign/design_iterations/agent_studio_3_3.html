<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body {
    background: #FAF7F2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E5DFD4; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #D8CFC0; }

  .token-chip {
    display: inline-flex;
    align-items: center;
    background: #FDECE4;
    color: #000;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .agent-card.active {
    background: #FFFFFF;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12), 0 2px 8px -2px rgba(0,0,0,0.06);
  }

  .agent-card:not(.active):hover {
    background: #F3EEE5;
  }

  .fade-in {
    animation: fadeIn .35s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dot-pulse {
    display: inline-flex;
    gap: 4px;
  }
  .dot-pulse span {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #A8A196;
    animation: dotPulse 1.2s infinite ease-in-out;
  }
  .dot-pulse span:nth-child(2) { animation-delay: .15s; }
  .dot-pulse span:nth-child(3) { animation-delay: .3s; }
  @keyframes dotPulse {
    0%, 80%, 100% { opacity: .25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  #sidebar-overlay {
    backdrop-filter: blur(2px);
  }

  textarea, input {
    font-family: inherit;
  }

  .scroll-thin {
    scrollbar-gutter: stable;
  }
</style>
</head>
<body class="text-black">

<div class="h-screen w-full flex overflow-hidden">

  <!-- Mobile overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/30 z-30 hidden lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-40 w-[260px] max-w-[85vw] bg-[#F3EEE5] flex flex-col
           transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out
           lg:rounded-none rounded-r-2xl lg:shadow-none shadow-2xl">

    <!-- Sidebar header (fixed) -->
    <div class="shrink-0 p-4 pb-3">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded-lg bg-black flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <span class="text-sm font-semibold tracking-tight">Agent Studio</span>
        </div>
        <button id="closeSidebarBtn" class="lg:hidden w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <button id="newAgentBtn"
        class="w-full flex items-center justify-center gap-1.5 bg-black text-white text-sm font-medium py-2 px-3 rounded-xl
               hover:bg-black/85 active:scale-[0.98] transition shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Agent</span>
      </button>

      <!-- Inline new-agent form -->
      <div id="newAgentForm" class="hidden mt-2 bg-white rounded-xl p-3 shadow-sm space-y-2 fade-in">
        <div>
          <label class="block text-[11px] font-semibold text-black/50 mb-1 uppercase tracking-wide">Agent name</label>
          <input id="newAgentName" type="text" placeholder="e.g. Blog Outline Builder"
            class="w-full bg-[#FAF7F2] rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-black/10 placeholder:text-black/30" />
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-black/50 mb-1 uppercase tracking-wide">Prompt template</label>
          <textarea id="newAgentPrompt" rows="3" placeholder="Write a {{tone}} note about {{topic}}..."
            class="w-full bg-[#FAF7F2] rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-black/10 placeholder:text-black/30 resize-none"></textarea>
        </div>
        <div class="flex gap-2 pt-1">
          <button id="createAgentBtn" class="flex-1 bg-black text-white text-sm font-medium py-2 rounded-lg hover:bg-black/85 transition">Create</button>
          <button id="cancelAgentBtn" class="flex-1 bg-[#F3EEE5] text-sm font-medium py-2 rounded-lg hover:bg-black/10 transition">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Scrollable agent list -->
    <div class="flex-1 overflow-y-auto scroll-thin px-3 pb-4 space-y-1.5">
      <div id="agentList"></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

    <!-- Top bar (mobile) -->
    <div class="lg:hidden shrink-0 flex items-center gap-2 px-3 py-3 bg-[#FAF7F2]">
      <button id="openSidebarBtn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="text-sm font-semibold" id="mobileTitle">Agent Studio</span>
    </div>

    <main id="workspace" class="flex-1 overflow-y-auto scroll-thin">
      <!-- content injected by JS -->
    </main>
  </div>
</div>

<!-- Config Modal -->
<div id="configModalOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
  <div id="configModal" class="bg-[#FAF7F2] w-full max-w-md rounded-2xl shadow-2xl p-5 fade-in max-h-[88vh] overflow-y-auto">
    <div class="flex items-start justify-between mb-4">
      <div>
        <h3 class="text-base font-semibold tracking-tight">Configure agent</h3>
        <p class="text-xs text-black/45 mt-0.5">Edit the name and prompt template.</p>
      </div>
      <button id="closeConfigBtn" class="w-8 h-8 shrink-0 flex items-center justify-center rounded-full bg-white hover:bg-black/5 transition shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="space-y-3">
      <div>
        <label class="block text-[11px] font-semibold text-black/50 mb-1.5 uppercase tracking-wide">Agent name</label>
        <input id="configName" type="text" class="w-full bg-white rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-black/10 shadow-sm" />
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-black/50 mb-1.5 uppercase tracking-wide">Prompt template</label>
        <textarea id="configPrompt" rows="5" class="w-full bg-white rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-black/10 shadow-sm resize-none"></textarea>
        <p class="text-[11px] text-black/40 mt-1.5">Use <span class="font-semibold">{{placeholder_name}}</span> tokens — one input field will be generated per unique placeholder.</p>
      </div>
    </div>

    <div class="flex gap-2 mt-5">
      <button id="saveConfigBtn" class="flex-1 bg-black text-white text-sm font-medium py-2.5 rounded-xl hover:bg-black/85 transition">Save changes</button>
      <button id="deleteAgentBtn" class="px-4 py-2.5 rounded-xl bg-[#FDECE4] text-black text-sm font-medium hover:bg-[#FBDCCC] transition">Delete</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const seedAgents = [
    {
      id: "email-writer",
      name: "Email Writer",
      prompt: "Write a {{tone}} email to {{recipient}} about {{topic}}. Keep it under {{length}} words.",
    },
    {
      id: "product-desc",
      name: "Product Description Generator",
      prompt: "Write a compelling product description for {{product_name}}, targeted at {{audience}}. Highlight the key benefit: {{key_benefit}}.",
    },
    {
      id: "code-explainer",
      name: "Code Explainer",
      prompt: "Explain the following {{language}} code to a {{audience_level}} developer in plain language:\n\n{{code_snippet}}",
    },
    {
      id: "meeting-summarizer",
      name: "Meeting Summarizer",
      prompt: "Summarize the meeting notes below into {{format}}, focused on decisions and action items. Attendees: {{attendees}}.\n\nNotes:\n{{meeting_notes}}",
    },
    {
      id: "social-caption",
      name: "Social Caption Creator",
      prompt: "Write a {{platform}} caption for a post about {{subject}} in a {{tone}} voice.",
    },
  ];

  let agents = seedAgents.map(a => ({ ...a, runs: [] }));
  let selectedId = agents[2].id; // Code Explainer pre-selected
  let configTargetId = null;

  const agentListEl = document.getElementById("agentList");
  const workspaceEl = document.getElementById("workspace");
  const mobileTitleEl = document.getElementById("mobileTitle");

  function extractPlaceholders(template) {
    const re = /\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g;
    const seen = new Set();
    const result = [];
    let m;
    while ((m = re.exec(template)) !== null) {
      if (!seen.has(m[1])) {
        seen.add(m[1]);
        result.push(m[1]);
      }
    }
    return result;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function labelize(name) {
    return name
      .split("_")
      .map(w => w.charAt(0).toUpperCase() + w.slice(1))
      .join(" ");
  }

  function initials(name) {
    const words = name.trim().split(/\s+/).slice(0, 2);
    return words.map(w => w[0].toUpperCase()).join("");
  }

  // ---------- Sidebar list ----------
  function renderAgentList() {
    agentListEl.innerHTML = "";
    agents.forEach(agent => {
      const isActive = agent.id === selectedId;
      const card = document.createElement("div");
      card.className = `agent-card relative rounded-xl p-2.5 pr-9 cursor-pointer transition ${isActive ? "active" : ""}`;
      card.innerHTML = `
        <div class="flex items-center gap-2.5">
          <div class="w-7 h-7 shrink-0 rounded-lg bg-gradient-to-br from-[#FDECE4] to-[#F3D9C9] flex items-center justify-center text-[11px] font-bold">
            ${initials(agent.name)}
          </div>
          <div class="min-w-0">
            <p class="text-[13px] font-semibold truncate leading-tight">${escapeHtml(agent.name)}</p>
            <p class="text-[11px] text-black/40 truncate mt-0.5 leading-tight">${escapeHtml(agent.prompt.slice(0, 36))}${agent.prompt.length > 36 ? "…" : ""}</p>
          </div>
        </div>
      `;
      card.addEventListener("click", () => selectAgent(agent.id));

      const gearBtn = document.createElement("button");
      gearBtn.className = "absolute bottom-1.5 right-1.5 w-6 h-6 flex items-center justify-center rounded-full bg-white/80 hover:bg-white shadow-sm transition";
      gearBtn.setAttribute("aria-label", "Configure agent");
      gearBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
      gearBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openConfigModal(agent.id);
      });

      card.appendChild(gearBtn);
      agentListEl.appendChild(card);
    });
  }

  // ---------- Workspace ----------
  function selectAgent(id) {
    selectedId = id;
    renderAgentList();
    renderWorkspace();
    closeSidebarMobile();
  }

  function renderEmptyState() {
    workspaceEl.innerHTML = `
      <div class="h-full flex items-center justify-center p-6">
        <div class="text-center max-w-sm fade-in">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-white shadow-sm flex items-center justify-center mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <h2 class="text-lg font-semibold tracking-tight mb-1.5">Select an agent to get started</h2>
          <p class="text-[13px] text-black/45 leading-relaxed">Choose an agent from the sidebar, or create a new one to define a prompt template and run it.</p>
        </div>
      </div>
    `;
  }

  function renderWorkspace() {
    const agent = agents.find(a => a.id === selectedId);
    if (!agent) {
      renderEmptyState();
      mobileTitleEl.textContent = "Agent Studio";
      return;
    }
    mobileTitleEl.textContent = agent.name;

    const placeholders = extractPlaceholders(agent.prompt);

    workspaceEl.innerHTML = `
      <div class="max-w-2xl mx-auto px-4 sm:px-6 py-4 sm:py-6 space-y-4 fade-in">

        <!-- Unified panel: header + inputs + run -->
        <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5">
          <p class="text-[11px] font-semibold text-black/40 uppercase tracking-wide mb-1">Agent</p>
          <h1 class="text-xl sm:text-2xl font-semibold tracking-tight mb-4">${escapeHtml(agent.name)}</h1>

          <p class="text-[11px] font-semibold text-black/40 uppercase tracking-wide mb-2">Inputs</p>
          <div id="inputFields" class="space-y-2.5">
            ${placeholders.length === 0 ? `<p class="text-[13px] text-black/40">This prompt has no placeholders — it's ready to run as-is.</p>` : ""}
          </div>

          <div class="border-t border-black/5 mt-4 pt-4">
            <button id="runBtn" class="w-full sm:w-auto sm:px-6 flex items-center justify-center gap-1.5 bg-black text-white text-sm font-medium py-2.5 px-4 rounded-xl hover:bg-black/85 active:scale-[0.98] transition shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <span>Run</span>
            </button>
          </div>
        </div>

        <!-- Response -->
        <div>
          <p class="text-[11px] font-semibold text-black/40 uppercase tracking-wide mb-2">Response</p>
          <div id="responsePanel" class="bg-gradient-to-br from-[#2A2622] to-[#181614] text-white rounded-2xl shadow-xl p-4 sm:p-5 min-h-[100px]">
            <div id="responseHistory" class="space-y-3"></div>
            <div id="responseEmpty" class="flex flex-col items-center justify-center text-center py-6 text-white/40">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <p class="text-[13px]">Run the agent to see its response here.</p>
            </div>
          </div>
        </div>
      </div>
    `;

    const inputFieldsEl = document.getElementById("inputFields");
    placeholders.forEach(name => {
      const wrap = document.createElement("div");
      wrap.innerHTML = `
        <label class="block text-[13px] font-medium mb-1">${escapeHtml(labelize(name))}</label>
        <input type="text" data-placeholder="${escapeHtml(name)}"
          class="ph-input w-full bg-[#FAF7F2] rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-black/10 placeholder:text-black/30"
          placeholder="Enter ${labelize(name).toLowerCase()}..." />
      `;
      inputFieldsEl.appendChild(wrap);
    });

    document.getElementById("runBtn").addEventListener("click", () => handleRun(agent, placeholders));
    renderResponseHistory(agent);
  }

  function renderResponseHistory(agent) {
    const historyEl = document.getElementById("responseHistory");
    const emptyEl = document.getElementById("responseEmpty");
    if (!historyEl) return;

    if (agent.runs.length === 0) {
      emptyEl.classList.remove("hidden");
      historyEl.innerHTML = "";
      return;
    }
    emptyEl.classList.add("hidden");

    historyEl.innerHTML = agent.runs.map((run, idx) => `
      <div class="fade-in ${idx !== 0 ? 'pt-3 border-t border-white/10' : ''}">
        <div class="flex items-center justify-between mb-1.5">
          <span class="inline-flex items-center gap-1 text-[10px] font-semibold uppercase tracking-wide text-white/40">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Run ${agent.runs.length - idx}
          </span>
          <span class="text-[10px] text-white/30">${run.time}</span>
        </div>
        <p class="text-[13px] leading-snug whitespace-pre-wrap text-white/95">${escapeHtml(run.output)}</p>
      </div>
    `).join("");
  }

  function handleRun(agent, placeholders) {
    const runBtn = document.getElementById("runBtn");
    const values = {};
    placeholders.forEach(name => {
      const input = document.querySelector(`.ph-input[data-placeholder="${CSS.escape(name)}"]`);
      values[name] = (input && input.value.trim()) || `[${name}]`;
    });

    runBtn.disabled = true;
    runBtn.innerHTML = `
      <span class="dot-pulse"><span></span><span></span><span></span></span>
      <span>Running…</span>
    `;

    setTimeout(() => {
      let output = agent.prompt.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (full, name) => values[name] ?? full);
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      agent.runs.unshift({ output, time });

      runBtn.disabled = false;
      runBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>Run</span>
      `;
      renderResponseHistory(agent);
    }, 650);
  }

  // ---------- New agent form ----------
  const newAgentBtn = document.getElementById("newAgentBtn");
  const newAgentForm = document.getElementById("newAgentForm");
  const newAgentName = document.getElementById("newAgentName");
  const newAgentPrompt = document.getElementById("newAgentPrompt");

  newAgentBtn.addEventListener("click", () => {
    newAgentForm.classList.toggle("hidden");
    if (!newAgentForm.classList.contains("hidden")) {
      newAgentName.focus();
    }
  });

  document.getElementById("cancelAgentBtn").addEventListener("click", () => {
    newAgentForm.classList.add("hidden");
    newAgentName.value = "";
    newAgentPrompt.value = "";
  });

  document.getElementById("createAgentBtn").addEventListener("click", () => {
    const name = newAgentName.value.trim();
    const prompt = newAgentPrompt.value.trim();
    if (!name) {
      newAgentName.focus();
      return;
    }
    const id = "agent-" + Date.now();
    const agent = {
      id,
      name,
      prompt: prompt || "Write something about {{topic}}.",
      runs: [],
    };
    agents.unshift(agent);
    newAgentForm.classList.add("hidden");
    newAgentName.value = "";
    newAgentPrompt.value = "";
    selectAgent(id);
  });

  // ---------- Config modal ----------
  const configModalOverlay = document.getElementById("configModalOverlay");
  const configName = document.getElementById("configName");
  const configPrompt = document.getElementById("configPrompt");

  function openConfigModal(id) {
    configTargetId = id;
    const agent = agents.find(a => a.id === id);
    if (!agent) return;
    configName.value = agent.name;
    configPrompt.value = agent.prompt;
    configModalOverlay.classList.remove("hidden");
    configModalOverlay.classList.add("flex");
  }

  function closeConfigModal() {
    configModalOverlay.classList.add("hidden");
    configModalOverlay.classList.remove("flex");
    configTargetId = null;
  }

  document.getElementById("closeConfigBtn").addEventListener("click", closeConfigModal);
  configModalOverlay.addEventListener("click", (e) => {
    if (e.target === configModalOverlay) closeConfigModal();
  });

  document.getElementById("saveConfigBtn").addEventListener("click", () => {
    const agent = agents.find(a => a.id === configTargetId);
    if (!agent) return;
    const name = configName.value.trim();
    const prompt = configPrompt.value.trim();
    if (!name || !prompt) return;
    agent.name = name;
    agent.prompt = prompt;
    closeConfigModal();
    renderAgentList();
    if (agent.id === selectedId) renderWorkspace();
  });

  document.getElementById("deleteAgentBtn").addEventListener("click", () => {
    if (!configTargetId) return;
    agents = agents.filter(a => a.id !== configTargetId);
    if (selectedId === configTargetId) {
      selectedId = agents.length ? agents[0].id : null;
    }
    closeConfigModal();
    renderAgentList();
    renderWorkspace();
  });

  // ---------- Mobile sidebar drawer ----------
  const sidebar = document.getElementById("sidebar");
  const sidebarOverlay = document.getElementById("sidebar-overlay");

  function openSidebarMobile() {
    sidebar.classList.remove("-translate-x-full");
    sidebarOverlay.classList.remove("hidden");
  }
  function closeSidebarMobile() {
    if (window.innerWidth < 1024) {
      sidebar.classList.add("-translate-x-full");
      sidebarOverlay.classList.add("hidden");
    }
  }

  document.getElementById("openSidebarBtn").addEventListener("click", openSidebarMobile);
  document.getElementById("closeSidebarBtn").addEventListener("click", closeSidebarMobile);
  sidebarOverlay.addEventListener("click", closeSidebarMobile);

  // ---------- Init ----------
  renderAgentList();
  renderWorkspace();
})();
</script>
</body>
</html>
