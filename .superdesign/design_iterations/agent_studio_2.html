<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  body {
    background-color: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

  .token-chip {
    display: inline-block;
    background-color: #14201c;
    color: #34d399;
    border: 1px solid #1f3a30;
    border-radius: 4px;
    padding: 0 4px;
    font-size: 0.8125rem;
  }

  .agent-row.active {
    background-color: #141414;
    border-color: #3a3a3a;
  }

  .fade-in { animation: fadeIn 200ms ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .spinner {
    border: 2px solid #2a2a2a;
    border-top-color: #34d399;
    border-radius: 50%;
    width: 16px;
    height: 16px;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #sidebarOverlay { transition: opacity 150ms ease; }
  #sidebar { transition: transform 200ms ease; }

  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #34d399;
    box-shadow: 0 0 0 1px #34d399;
  }
</style>
</head>
<body class="bg-[#0a0a0a] text-white h-screen overflow-hidden">

<div class="flex h-screen w-full overflow-hidden">

  <!-- Mobile overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/70 z-30 hidden md:hidden" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed md:static z-40 top-0 left-0 h-full w-[280px] shrink-0 bg-[#0d0d0d] border-r border-[#222222] flex flex-col -translate-x-full md:translate-x-0">

    <!-- Sidebar header (fixed) -->
    <div class="shrink-0 border-b border-[#1f1f1f] p-4">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded bg-gradient-to-br from-emerald-500 to-emerald-800 flex items-center justify-center text-[11px] font-bold text-black">AS</div>
          <span class="font-semibold text-[15px] tracking-tight">Agent Studio</span>
        </div>
        <button onclick="closeSidebar()" class="md:hidden text-gray-400 hover:text-white p-1" aria-label="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <button id="newAgentBtn" onclick="toggleNewAgentForm()"
        class="w-full flex items-center justify-center gap-2 bg-white text-black text-sm font-medium rounded-md py-2 hover:bg-gray-200 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Agent
      </button>

      <!-- Inline new agent form -->
      <div id="newAgentForm" class="hidden mt-3 border border-[#2a2a2a] rounded-md p-3 bg-[#111111] fade-in">
        <label class="block text-[11px] uppercase tracking-wide text-gray-500 mb-1">Agent name</label>
        <input id="newAgentName" type="text" placeholder="e.g. Bug Report Formatter"
          class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded px-2 py-1.5 text-sm mb-2 text-white placeholder-gray-600" />
        <label class="block text-[11px] uppercase tracking-wide text-gray-500 mb-1">Prompt template</label>
        <textarea id="newAgentPrompt" rows="4" placeholder="Use {{placeholders}} like this..."
          class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded px-2 py-1.5 text-sm mono text-white placeholder-gray-600 resize-none mb-2"></textarea>
        <div class="flex gap-2">
          <button onclick="createAgent()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-semibold rounded py-1.5 transition-colors">Create</button>
          <button onclick="toggleNewAgentForm()" class="flex-1 bg-[#1a1a1a] hover:bg-[#242424] border border-[#2a2a2a] text-xs font-medium rounded py-1.5 transition-colors">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Scrollable agent list -->
    <div class="flex-1 overflow-y-auto p-3 space-y-2" id="agentList"></div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0 h-full">

    <!-- Mobile top bar -->
    <div class="md:hidden shrink-0 flex items-center gap-3 border-b border-[#1f1f1f] px-4 py-3 bg-[#0a0a0a]">
      <button onclick="openSidebar()" class="text-gray-300 hover:text-white p-1" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="font-semibold text-sm tracking-tight">Agent Studio</span>
    </div>

    <main class="flex-1 overflow-y-auto">
      <!-- Empty state -->
      <div id="emptyState" class="hidden h-full min-h-[70vh] flex flex-col items-center justify-center text-center px-6">
        <div class="w-12 h-12 rounded-lg border border-[#2a2a2a] flex items-center justify-center mb-4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2L12 16.4 5.7 21l2.3-7.2-6-4.6h7.6z"/></svg>
        </div>
        <h2 class="text-lg font-semibold mb-1">Select an agent to get started</h2>
        <p class="text-sm text-gray-500 max-w-[320px]">Choose an agent from the sidebar, or create a new one to define a prompt template.</p>
      </div>

      <!-- Workspace -->
      <div id="workspace" class="hidden max-w-[820px] mx-auto px-5 md:px-8 py-6 md:py-8">

        <!-- Header -->
        <div class="mb-6">
          <div class="flex items-center justify-between gap-3 mb-3">
            <h1 id="agentTitle" class="text-xl md:text-2xl font-semibold tracking-tight"></h1>
            <span class="shrink-0 text-[11px] uppercase tracking-wide text-gray-500 border border-[#2a2a2a] rounded px-2 py-1">Template</span>
          </div>
          <div id="promptPreview" class="mono text-[13px] leading-relaxed text-gray-300 bg-[#0d0d0d] border border-[#1f1f1f] rounded-lg p-4 whitespace-pre-wrap"></div>
        </div>

        <!-- Inputs -->
        <div class="mb-6">
          <h3 class="text-[11px] uppercase tracking-wide text-gray-500 mb-3">Inputs</h3>
          <div id="inputFields" class="space-y-3"></div>
        </div>

        <button id="runBtn" onclick="runAgent()"
          class="w-full md:w-auto flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-black text-sm font-semibold rounded-md px-5 py-2.5 transition-colors mb-8">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Run
        </button>

        <!-- Response -->
        <div>
          <h3 class="text-[11px] uppercase tracking-wide text-gray-500 mb-3">Response</h3>
          <div id="responsePanel" class="min-h-[120px] bg-[#0d0d0d] border border-[#1f1f1f] rounded-lg p-4">
            <p class="text-sm text-gray-600">Run the agent to see output here.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Config modal -->
<div id="configModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/70" onclick="closeConfig()"></div>
  <div class="relative w-full max-w-[540px] bg-[#0d0d0d] border border-[#2a2a2a] rounded-lg p-5 fade-in">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-base font-semibold">Configure Agent</h3>
      <button onclick="closeConfig()" class="text-gray-400 hover:text-white p-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <label class="block text-[11px] uppercase tracking-wide text-gray-500 mb-1">Name</label>
    <input id="configName" type="text" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded px-2.5 py-2 text-sm mb-3 text-white" />
    <label class="block text-[11px] uppercase tracking-wide text-gray-500 mb-1">Prompt template</label>
    <textarea id="configPrompt" rows="6" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded px-2.5 py-2 text-sm mono text-white resize-none mb-4"></textarea>
    <div class="flex items-center justify-between gap-2">
      <button onclick="deleteAgent()" class="text-xs font-medium text-red-400 hover:text-red-300 px-2 py-1.5">Delete agent</button>
      <div class="flex gap-2">
        <button onclick="closeConfig()" class="bg-[#1a1a1a] hover:bg-[#242424] border border-[#2a2a2a] text-xs font-medium rounded px-3 py-1.5 transition-colors">Cancel</button>
        <button onclick="saveConfig()" class="bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-semibold rounded px-3 py-1.5 transition-colors">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
  let agents = [
    {
      id: 'a1',
      name: 'Email Writer',
      prompt: 'Write a {{tone}} email to {{recipient}} about {{topic}}. Keep it under {{word_limit}} words.'
    },
    {
      id: 'a2',
      name: 'Product Description Generator',
      prompt: 'Write a compelling product description for {{product_name}}, targeting {{audience}}. Highlight the key benefit: {{key_benefit}}.'
    },
    {
      id: 'a3',
      name: 'Code Explainer',
      prompt: 'Explain the following {{language}} code to a {{experience_level}} developer:\n\n{{code_snippet}}'
    },
    {
      id: 'a4',
      name: 'Meeting Summarizer',
      prompt: 'Summarize the meeting notes below into key decisions and action items. Meeting title: {{meeting_title}}.\n\n{{meeting_notes}}'
    },
    {
      id: 'a5',
      name: 'Social Media Caption Writer',
      prompt: 'Write a {{platform}} caption for a post about {{subject}} in a {{tone}} voice.'
    }
  ];

  let activeAgentId = 'a1';
  let configTargetId = null;

  function getAgent(id) { return agents.find(a => a.id === id); }

  function extractPlaceholders(template) {
    const matches = template.match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g) || [];
    const names = matches.map(m => m.replace(/\{\{\s*|\s*\}\}/g, ''));
    return [...new Set(names)];
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderPromptPreview(template) {
    const escaped = escapeHtml(template);
    return escaped.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, '<span class="token-chip">{{$1}}</span>');
  }

  function renderAgentList() {
    const list = document.getElementById('agentList');
    list.innerHTML = '';
    agents.forEach(agent => {
      const row = document.createElement('div');
      row.className = 'agent-row relative border border-[#1f1f1f] rounded-md px-3 py-3 pr-9 cursor-pointer hover:bg-[#131313] transition-colors' + (agent.id === activeAgentId ? ' active' : '');
      row.onclick = () => selectAgent(agent.id);

      const nameEl = document.createElement('div');
      nameEl.className = 'text-sm font-medium truncate pr-1';
      nameEl.textContent = agent.name;

      const phEl = document.createElement('div');
      phEl.className = 'mono text-[11px] text-gray-500 mt-1 truncate';
      const phs = extractPlaceholders(agent.prompt);
      phEl.textContent = phs.length ? phs.map(p => '{{' + p + '}}').join(' ') : 'no placeholders';

      const gearBtn = document.createElement('button');
      gearBtn.className = 'absolute bottom-2 right-2 text-gray-500 hover:text-emerald-400 p-1 rounded transition-colors';
      gearBtn.setAttribute('aria-label', 'Configure agent');
      gearBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>';
      gearBtn.onclick = (e) => { e.stopPropagation(); openConfig(agent.id); };

      row.appendChild(nameEl);
      row.appendChild(phEl);
      row.appendChild(gearBtn);
      list.appendChild(row);
    });
  }

  function selectAgent(id) {
    activeAgentId = id;
    renderAgentList();
    renderWorkspace();
    closeSidebar();
  }

  function renderWorkspace() {
    const agent = getAgent(activeAgentId);
    const empty = document.getElementById('emptyState');
    const ws = document.getElementById('workspace');

    if (!agent) {
      empty.classList.remove('hidden');
      empty.classList.add('flex');
      ws.classList.add('hidden');
      return;
    }

    empty.classList.add('hidden');
    empty.classList.remove('flex');
    ws.classList.remove('hidden');

    document.getElementById('agentTitle').textContent = agent.name;
    document.getElementById('promptPreview').innerHTML = renderPromptPreview(agent.prompt);

    const placeholders = extractPlaceholders(agent.prompt);
    const fieldsWrap = document.getElementById('inputFields');
    fieldsWrap.innerHTML = '';

    if (placeholders.length === 0) {
      fieldsWrap.innerHTML = '<p class="text-sm text-gray-600">This template has no placeholders.</p>';
    }

    placeholders.forEach(ph => {
      const wrap = document.createElement('div');
      const label = document.createElement('label');
      label.className = 'block text-xs font-medium text-gray-400 mb-1.5';
      label.textContent = ph.replace(/_/g, ' ');

      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'field-' + ph;
      input.placeholder = 'Enter ' + ph.replace(/_/g, ' ') + '...';
      input.className = 'w-full bg-[#0d0d0d] border border-[#2a2a2a] rounded-md px-3 py-2 text-sm text-white placeholder-gray-600 mono';

      wrap.appendChild(label);
      wrap.appendChild(input);
      fieldsWrap.appendChild(wrap);
    });

    const responsePanel = document.getElementById('responsePanel');
    responsePanel.innerHTML = '<p class="text-sm text-gray-600">Run the agent to see output here.</p>';
  }

  function runAgent() {
    const agent = getAgent(activeAgentId);
    if (!agent) return;

    const placeholders = extractPlaceholders(agent.prompt);
    const responsePanel = document.getElementById('responsePanel');
    const runBtn = document.getElementById('runBtn');

    runBtn.disabled = true;
    runBtn.classList.add('opacity-60', 'cursor-not-allowed');
    responsePanel.innerHTML = '<div class="flex items-center gap-2 text-sm text-gray-400"><div class="spinner"></div>Generating response...</div>';

    setTimeout(() => {
      let output = agent.prompt;
      placeholders.forEach(ph => {
        const field = document.getElementById('field-' + ph);
        const val = (field && field.value.trim()) ? field.value.trim() : '[' + ph + ']';
        output = output.split('{{' + ph + '}}').join(val);
      });

      responsePanel.innerHTML = '<p class="mono text-[13px] leading-relaxed text-gray-100 whitespace-pre-wrap fade-in"></p>';
      responsePanel.querySelector('p').textContent = output;

      runBtn.disabled = false;
      runBtn.classList.remove('opacity-60', 'cursor-not-allowed');
    }, 750);
  }

  function toggleNewAgentForm() {
    const form = document.getElementById('newAgentForm');
    form.classList.toggle('hidden');
    if (!form.classList.contains('hidden')) {
      document.getElementById('newAgentName').value = '';
      document.getElementById('newAgentPrompt').value = '';
      document.getElementById('newAgentName').focus();
    }
  }

  function createAgent() {
    const nameInput = document.getElementById('newAgentName');
    const promptInput = document.getElementById('newAgentPrompt');
    const name = nameInput.value.trim();
    const prompt = promptInput.value.trim();

    if (!name) { nameInput.focus(); return; }

    const id = 'a' + Date.now();
    agents.push({ id, name, prompt: prompt || 'Write about {{topic}} in a {{tone}} tone.' });
    activeAgentId = id;
    toggleNewAgentForm();
    renderAgentList();
    renderWorkspace();
    closeSidebar();
  }

  function openConfig(id) {
    configTargetId = id;
    const agent = getAgent(id);
    document.getElementById('configName').value = agent.name;
    document.getElementById('configPrompt').value = agent.prompt;
    const modal = document.getElementById('configModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function closeConfig() {
    configTargetId = null;
    const modal = document.getElementById('configModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function saveConfig() {
    const agent = getAgent(configTargetId);
    if (!agent) return;
    const name = document.getElementById('configName').value.trim();
    const prompt = document.getElementById('configPrompt').value;
    if (!name) return;
    agent.name = name;
    agent.prompt = prompt;
    renderAgentList();
    if (agent.id === activeAgentId) renderWorkspace();
    closeConfig();
  }

  function deleteAgent() {
    if (!configTargetId) return;
    agents = agents.filter(a => a.id !== configTargetId);
    if (activeAgentId === configTargetId) {
      activeAgentId = agents.length ? agents[0].id : null;
    }
    closeConfig();
    renderAgentList();
    renderWorkspace();
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.remove('hidden');
  }
  function closeSidebar() {
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    }
  }

  window.addEventListener('resize', () => {
    if (window.innerWidth >= 768) {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    } else {
      document.getElementById('sidebar').classList.add('-translate-x-full');
    }
  });

  renderAgentList();
  renderWorkspace();
</script>
</body>
</html>
